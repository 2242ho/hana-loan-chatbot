<style>
  :root{
    --navy-950:#12192B;
    --navy-900:#16233F;
    --navy-800:#22345A;
    --navy-100:#E7EAF2;
    --gold:#C99B3C;
    --gold-dim:#EADFC2;
    --green:#2F7A5A;
    --green-bg:#E7F3EC;
    --amber:#B8791E;
    --amber-bg:#FBF0DD;
    --red:#B5443A;
    --red-bg:#FAE9E7;
    --bg:#F3F4F8;
    --card:#FFFFFF;
    --ink:#1A1F2B;
    --ink-dim:#6B7280;
    --line:#E4E6EC;
    --mono: "SFMono-Regular","Roboto Mono","Consolas",monospace;
    --sans: -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);}
  #app-root{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:32px;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    background:linear-gradient(135deg,var(--navy-900),var(--navy-950));
    color:#fff;
    padding:20px 18px 22px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute;right:-40px;top:-40px;width:140px;height:140px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(201,155,60,0.25),transparent 70%);
  }
  .topbar-eyebrow{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dim);
    font-weight:600;margin-bottom:4px;
  }
  .topbar-title{
    font-size:21px;font-weight:800;letter-spacing:-0.02em;
  }
  .topbar-sub{
    font-size:12.5px;color:#B9C2D6;margin-top:2px;
  }
  .back-btn{
    background:rgba(255,255,255,0.12);border:none;color:#fff;
    padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:4px;margin-bottom:10px;cursor:pointer;
  }
  .container{padding:14px 14px 0;}
  .search-row{display:flex;gap:8px;margin-bottom:12px;}
  .search-input{
    flex:1;padding:11px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);font-size:14px;color:var(--ink);
  }
  .search-input:focus{outline:2px solid var(--navy-800);outline-offset:1px;}
  .add-btn{
    background:var(--navy-900);color:#fff;border:none;border-radius:10px;
    padding:0 16px;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer;
  }
  .add-btn:active{opacity:0.85;}
  .stat-row{display:flex;gap:8px;margin-bottom:14px;}
  .stat-chip{
    flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:9px 10px;text-align:center;
  }
  .stat-chip .n{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--navy-900);}
  .stat-chip .l{font-size:10.5px;color:var(--ink-dim);margin-top:1px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;margin-bottom:10px;cursor:pointer;
    transition:box-shadow .15s;
  }
  .card:active{box-shadow:inset 0 0 0 2px var(--navy-100);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .card-name{font-size:15.5px;font-weight:700;}
  .card-phone{font-size:12px;color:var(--ink-dim);margin-top:1px;font-family:var(--mono);}
  .badge{
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;
  }
  .badge-blue{background:#E4EAFB;color:#33499A;}
  .badge-amber{background:var(--amber-bg);color:var(--amber);}
  .badge-purple{background:#EFE5FB;color:#6B3FA0;}
  .badge-green{background:var(--green-bg);color:var(--green);}
  .badge-teal{background:#DFF2F0;color:#227A70;}
  .badge-gray{background:#EDEEF2;color:#6B7280;}
  .badge-red{background:var(--red-bg);color:var(--red);}
  .card-meta{display:flex;flex-direction:column;gap:4px;margin-top:9px;font-size:12px;color:var(--ink-dim);}
  .card-meta b{color:var(--ink);font-family:var(--mono);}
  .card-dsr{
    margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);
    display:flex;justify-content:space-between;align-items:center;
  }
  .card-dsr .lbl{font-size:11.5px;color:var(--ink-dim);}
  .card-dsr .val{font-family:var(--mono);font-weight:800;font-size:15px;}
  .empty{
    text-align:center;padding:60px 20px;color:var(--ink-dim);
  }
  .empty-icon{font-size:38px;margin-bottom:10px;}
  .empty-title{font-weight:700;color:var(--ink);font-size:15px;margin-bottom:4px;}
  .empty-sub{font-size:13px;}

  /* Detail / form */
  .section{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:12px;
  }
  /* 상담 중 항상 화면에 붙어있는 헤더 (DSR 요약 + 섹션 바로가기) */
  .detail-sticky{
    position:sticky;top:0;z-index:30;
    margin:0 -14px 12px;padding:0 14px;
    background:var(--bg);
    box-shadow:0 4px 12px rgba(18,25,43,0.16);
  }
  .sticky-summary{
    background:var(--navy-950);color:#fff;
    border-radius:0 0 12px 12px;
    padding:9px 13px;margin:0 -14px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .sticky-summary .ss-name{font-weight:800;font-size:13px;flex:none;}
  .sticky-summary .ss-dsr{font-family:var(--mono);font-weight:800;font-size:16px;margin-left:auto;}
  .sticky-summary .ss-sub{font-size:11px;color:#B9C2D6;width:100%;margin-top:-2px;}
  /* 섹션 바로가기 칩 */
  .jump-row{
    display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin:0;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .jump-row::-webkit-scrollbar{display:none;}
  .jump-chip{
    flex:none;padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:700;
    border:1.5px solid var(--line);background:#FBFBFD;color:var(--ink-dim);cursor:pointer;white-space:nowrap;
  }
  /* 고정 헤더에 가리지 않도록 바로가기 이동 시 여백 확보 */
  #sec-basic,#sec-product,#sec-schedule,#sec-income,#sec-newloan,#sec-existing,#sec-dsr{
    scroll-margin-top:104px;
  }
  /* 접기/펼치기 */
  .section-title.collapsible{cursor:pointer;user-select:none;display:flex;align-items:center;}
  .section-title .caret{margin-left:auto;font-size:11px;color:var(--ink-dim);font-weight:700;}
  .section-body.collapsed{display:none;}
  .section-title{
    font-size:13px;font-weight:800;color:var(--navy-900);margin-bottom:11px;
    display:flex;align-items:center;gap:6px;letter-spacing:-0.01em;
  }
  .section-title .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
  .field-row{display:flex;gap:8px;margin-bottom:8px;}
  .field{flex:1;display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11.5px;color:var(--ink-dim);font-weight:600;}
  .field input, .field select, .field textarea{
    border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13.5px;
    font-family:var(--sans);background:#FBFBFD;color:var(--ink);width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--navy-800);background:#fff;
  }
  .field.num input{font-family:var(--mono);}
  .status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .status-opt{
    text-align:center;padding:8px 4px;border-radius:8px;font-size:12px;font-weight:700;
    border:1.5px solid var(--line);color:var(--ink-dim);cursor:pointer;background:#FBFBFD;
  }
  .status-opt.active{border-color:var(--navy-900);background:var(--navy-900);color:#fff;}
  .lawwork-opt{
    text-align:center;padding:8px 4px;border-radius:8px;font-size:12px;font-weight:700;
    border:1.5px solid var(--line);color:var(--ink-dim);cursor:pointer;background:#FBFBFD;
  }
  .lawwork-opt.active{border-color:var(--navy-900);background:var(--navy-900);color:#fff;}

  .loan-row{
    border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#FBFBFD;
  }
  .loan-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .loan-row-top .tag{font-size:11px;font-weight:700;color:var(--navy-800);}
  .rm-btn{
    background:none;border:none;color:var(--red);font-size:12px;font-weight:700;cursor:pointer;
    padding:2px 6px;
  }
  .add-loan-btn{
    width:100%;padding:10px;border-radius:9px;border:1.5px dashed var(--navy-800);
    background:none;color:var(--navy-800);font-weight:700;font-size:13px;cursor:pointer;
  }
  .stress-presets{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .preset-btn{
    padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:#fff;
    font-size:11.5px;color:var(--ink-dim);cursor:pointer;font-family:var(--mono);
  }
  .preset-btn.active{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}
  .checkbox-row{display:flex;align-items:center;gap:7px;margin-top:4px;}
  .checkbox-row input{width:15px;height:15px;}
  .checkbox-row label{font-size:12.5px;color:var(--ink-dim);}

  /* DSR result */
  .dsr-panel{
    background:linear-gradient(155deg,var(--navy-900),var(--navy-950));
    border-radius:14px;padding:18px 16px;color:#fff;margin-bottom:12px;position:relative;overflow:hidden;
  }
  .gauge-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:6px;}
  .gauge-val{font-family:var(--mono);font-size:34px;font-weight:800;margin-top:-46px;}
  .gauge-cap{font-size:11px;color:#AEB8CF;letter-spacing:.08em;text-transform:uppercase;margin-top:-2px;}
  .dsr-status-line{
    text-align:center;font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:8px;margin-top:8px;
  }
  .dsr-breakdown{margin-top:14px;border-top:1px solid rgba(255,255,255,0.14);padding-top:12px;}
  .bd-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;color:#C7CEE0;}
  .bd-row b{color:#fff;font-family:var(--mono);font-weight:700;}
  .bd-row.total{border-top:1px dashed rgba(255,255,255,0.2);margin-top:4px;padding-top:8px;font-size:13px;}
  .bd-row.total b{color:var(--gold);font-size:14px;}
  .limit-note{
    margin-top:12px;background:rgba(255,255,255,0.08);border-radius:9px;padding:9px 11px;font-size:12px;color:#E4E8F2;
  }
  .limit-note b{color:var(--gold);font-family:var(--mono);}

  .save-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--card);border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;
    box-shadow:0 -4px 14px rgba(0,0,0,0.08);
  }
  .back-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--card);border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 14px rgba(0,0,0,0.08);
  }
  .back-bar > button{width:100%;}
  .btn-primary{
    flex:1;background:var(--navy-900);color:#fff;border:none;border-radius:11px;
    padding:13px;font-size:14.5px;font-weight:800;cursor:pointer;
  }
  .btn-danger{
    background:#fff;color:var(--red);border:1.5px solid var(--red);border-radius:11px;
    padding:13px 16px;font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--navy-950);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;
    font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,0.25);z-index:50;opacity:0;pointer-events:none;
    transition:opacity .25s;
  }
  .toast.show{opacity:1;}
  .disclaimer{font-size:10.5px;color:var(--ink-dim);text-align:center;padding:10px 20px 0;line-height:1.5;}
  textarea{resize:vertical;min-height:54px;}

  /* 상담표 sheet view */
  .sheet-page{background:#fff;color:#111;font-family:var(--sans);max-width:820px;margin:0 auto;padding:4px 2px 40px;}
  .sheet-draw-wrap{position:relative;max-width:820px;margin:0 auto;}
  .sheet-draw-wrap .sheet-page{margin:0;}
  .sheet-draw-canvas{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;pointer-events:none;}
  .sheet-draw-canvas.on{pointer-events:auto;cursor:crosshair;}
  .draw-swatch{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,0.5);cursor:pointer;padding:0;}
  .draw-swatch.active{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,0.3);}
  .sheet-toolbar{display:flex;gap:8px;padding:12px 14px;background:var(--navy-950);position:sticky;top:0;z-index:5;flex-wrap:wrap;}
  .sheet-h1{font-size:17px;font-weight:800;text-align:center;padding:14px 10px 4px;color:#111;}
  .sheet-h2{font-size:12px;text-align:center;color:#666;padding-bottom:10px;}
  .sheet-bar{
    background:var(--navy-900);color:#fff;font-size:12.5px;font-weight:800;
    padding:7px 12px;margin:14px 12px 0;border-radius:6px 6px 0 0;letter-spacing:-0.01em;
  }
  .sheet-box{border:1px solid var(--navy-900);border-top:none;margin:0 12px;padding:10px 12px;border-radius:0 0 6px 6px;}
  .sheet-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px;}
  .sheet-grid.c3{grid-template-columns:repeat(3,1fr);}
  .sheet-fld{display:flex;flex-direction:column;gap:3px;}
  .sheet-fld label{font-size:10.5px;color:#666;font-weight:700;}
  .sheet-fld input, .sheet-fld select{
    border:none;border-bottom:1.3px solid #B9C2D6;padding:4px 2px;font-size:13px;
    font-family:var(--mono);background:transparent;color:#111;
  }
  .sheet-fld input:focus{outline:none;border-bottom-color:var(--navy-900);}
  .sheet-note{font-size:11px;color:#555;line-height:1.7;margin-top:4px;}
  .sheet-check-row{display:flex;align-items:center;gap:7px;font-size:12px;color:#333;padding:3px 0;}
  .sheet-check-row input{width:14px;height:14px;}
  .sheet-check-row .pct{margin-left:auto;font-family:var(--mono);color:var(--navy-800);font-weight:700;}
  .sheet-formula{

    amountWon = Math.round(amountWon||0);

    const eok = Math.floor(amountWon/100000000);
    const man = Math.floor((amountWon%100000000)/10000);
    const won = amountWon%10000;
    let s='';
    if(eok>0) s += eok+'억 ';
    if(man>0) s += man.toLocaleString('ko-KR')+'만';
    if(won>0) s += (man>0||eok>0?' ':'')+won.toLocaleString('ko-KR');
    return s.trim()+'원';

    if(d.length<4) return d;
    if(d.length<7) return d.slice(0,3)+'-'+d.slice(3);
    if(d.length<11) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
    return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7,11);
  }

    el.value = raw ? Number(raw).toLocaleString('ko-KR') : '';
    const pos = Math.max(0, el.value.length - cursorFromEnd);
    try{ el.setSelectionRange(pos,pos); }catch(e){}
    const hint = el.parentElement && el.parentElement.querySelector('.money-kr');
    if(hint){
      const n = raw ? Number(raw) : 0;
      const unit = el.getAttribute('data-unit');
      const mult = unit==='thousand' ? 1000 : (unit==='won' ? 1 : 10000);
      const wonVal = n*mult;
      if(el.getAttribute('data-hint')==='approx'){
        hint.textContent = n ? `약 ${Math.round(wonVal).toLocaleString('ko-KR')}원` : '';
      } else {
        hint.textContent = n ? krWon(wonVal) : '';
      }
    }

  function preserveFocusRerender(fn){

        focusId = active.id;
        if(typeof active.selectionStart === 'number'){

        }

          el.focus();
          if(selStart!=null && typeof el.setSelectionRange==='function'){
            try{ el.setSelectionRange(selStart, selEnd); }catch(e){}

        }
      }
    }, 0);

  function mergeBackup(file){
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!Array.isArray(parsed)) throw new Error('invalid');
        let added = 0, updated = 0, kept = 0;
        parsed.forEach(nc=>{
          if(!nc.incomeInfo) nc.incomeInfo = { spouseCombine:false, selfType:'근로소득', selfAmount:nc.income||'', selfCard:'', spouseType:'근로소득', spouseAmount:'', spouseCard:'' };
          if(!nc.sheet) nc.sheet = {};
          if(!nc.docs) nc.docs = {};
          const idx = customers.findIndex(c=> c.id===nc.id || (nc.name && nc.phone && c.name===nc.name && c.phone===nc.phone));
          if(idx===-1){
            customers.push(nc); added++;
            return;
          }
          const existingTime = customers[idx].updatedAt || 0;
          const incomingTime = nc.updatedAt || 0;
          if(incomingTime > existingTime){ customers[idx] = nc; updated++; }
          else { kept++; }
        });
        await saveCustomers(false);
        doToast(`백업 합치기 완료 (신규 ${added}명, 최신정보로 갱신 ${updated}명, 기존유지 ${kept}명)`);
        render();
      }catch(e){ doToast('불러오기 실패 — 올바른 백업 파일인지 확인해주세요'); }
    };
    reader.readAsText(file);
  }

  // "101동 1502호" / "1502" / "15층" 등에서 층수를 추론한다.
  // 호수는 뒤 두 자리가 호번호이므로 1502→15층, 502→5층, 101→1층.
  function floorFromUnitNumber(unitNumber){
    if(!unitNumber) return null;
    const s = String(unitNumber);
    const direct = s.match(/(\d+)\s*층/);
    if(direct) return parseInt(direct[1],10) || null;
    // "…호" 앞의 숫자를 우선 사용, 없으면 마지막 숫자 덩어리 사용
    let hoMatch = s.match(/(\d+)\s*호/);
    let numStr = hoMatch ? hoMatch[1] : null;
    if(!numStr){
      const nums = s.match(/\d+/g);
      if(!nums || nums.length===0) return null;
      // 동 번호만 있는 경우(예: "101동")는 층 추론 불가
      if(/동\s*$/.test(s.trim())) return null;
      numStr = nums[nums.length-1];
    }
    if(numStr.length<3) return null;      // 두 자리 이하는 층 판단 불가
    const floor = parseInt(numStr.slice(0, numStr.length-2), 10);
    return floor>0 ? floor : null;
  }
  // 현장에 등록된 층구분 라벨("1층", "2층~4층", "5층이상")이 해당 층을 포함하는지
  function floorLabelMatches(label, floor){
    if(!label || floor===null) return false;
    const nums = (label.match(/\d+/g)||[]).map(n=>parseInt(n,10));
    if(nums.length===0) return false;
    if(/이상|~\s*$|초과/.test(label) && nums.length===1) return floor >= nums[0];
    if(/이하|미만/.test(label) && nums.length===1) return floor <= nums[0];
    if(nums.length>=2) return floor >= Math.min(nums[0],nums[1]) && floor <= Math.max(nums[0],nums[1]);
    return floor === nums[0];
  }
  // 동호수에서 층을 뽑아 해당 층구분을 찾아준다 (못 찾으면 null)
  function autoFloorLabel(unit, unitNumber){
    const floor = floorFromUnitNumber(unitNumber);
    if(floor===null || !unit || !unit.floors) return null;
    const exact = unit.floors.find(f=>floorLabelMatches(f.label, floor));
    if(exact) return exact.label;
    // 범위를 벗어나면 가장 높은 구간(대개 "N층이상")으로 처리
    const openTop = unit.floors.find(f=>/이상/.test(f.label));
    return openTop ? openTop.label : null;
  }
  function applyAppraisalFromSite(c, site){
    if(!site) return;
    const unit = site.units.find(u=>u.area===c.jipdanArea);

    if(floor) c.jipdanAppraisal = stripComma(floor.price);
  }
  function applySiteAutoFill(c, site, resetArea){
    if(!site){ c.jipdanArea=''; c.jipdanFloorLabel=''; c.jipdanLawFirm=''; c.jipdanMoveInPeriod=''; return; }
    c.apartmentName = site.name;
    if(resetArea || !site.units.find(u=>u.area===c.jipdanArea)){
      c.jipdanArea = site.units[0] ? site.units[0].area : '';
    }
    const unit = site.units.find(u=>u.area===c.jipdanArea);
    // 동호수를 입력했으면 층을 추론해 층구분을 자동 선택한다
    const auto = autoFloorLabel(unit, c.unitNumber);
    if(auto){
      c.jipdanFloorLabel = auto;
      c.jipdanFloorAuto = true;
    } else if(unit && !unit.floors.find(f=>f.label===c.jipdanFloorLabel)){
      c.jipdanFloorLabel = unit.floors[0] ? unit.floors[0].label : '';
      c.jipdanFloorAuto = false;
    }
    c.jipdanLawFirm = site.lawFirm;
    c.jipdanMoveInPeriod = site.moveInPeriod;
    applyAppraisalFromSite(c, site);
  }

  function autoFitCols(rows){
    const colCount = rows.reduce((m,r)=>Math.max(m,r.length),0);
    const widths = [];
    for(let i=0;i<colCount;i++){
      let max = 6;
      rows.forEach(r=>{
        const val = r[i]==null ? '' : String(r[i]);
        let len = 0;
        for(const ch of val){ len += /[\u3131-\uD79D\uAC00-\uD7A3]/.test(ch) ? 2 : 1; }
        if(len>max) max = len;
      });
      widths.push({ wch: max+2 });
    }
    return widths;
  }

  // ---------- finance math ----------
  function annualRepayment(balance, ratePct, months, method){
    balance = parseFloat(balance)||0; ratePct = parseFloat(ratePct)||0; months = parseInt(months)||0;
    if(balance<=0 || months<=0) return 0;
    const r = ratePct/100/12;
    if(method === '만기일시'){
      return balance * (ratePct/100);
    }
    if(method === '원금균등'){
      const monthlyPrincipal = balance/months;
      const n = Math.min(12, months);
      let interestSum = 0;
      for(let i=0;i<n;i++){
        const remain = balance - monthlyPrincipal*i;
        interestSum += remain * r;
      }
      return monthlyPrincipal*n + interestSum;
    }
    // 원리금균등 (default)
    let pmt;
    if(r===0){ pmt = balance/months; }
    else { pmt = balance * r * Math.pow(1+r, months) / (Math.pow(1+r, months)-1); }
    return pmt * Math.min(12, months);
  }

  function principalFromAnnualBudget(annualBudget, ratePct, months){
    ratePct = parseFloat(ratePct)||0; months = parseInt(months)||0;
    if(annualBudget<=0 || months<=0) return 0;
    const monthlyBudget = annualBudget/12;
    const r = ratePct/100/12;
    if(r===0) return monthlyBudget*months;
    return monthlyBudget * (Math.pow(1+r,months)-1) / (r*Math.pow(1+r,months));
  }

  const CARD_INCOME_CAP_WON = 50000000; // 카드사용액 기준 인정소득 최대 5,000만원
  const REMIT_FEE_FIXED = 30000; // 송금수수료 고정값
  function stampDutyByAmount(wonAmount){
    if(wonAmount<=50000000) return 0;

  ];
  const CIRCLED_NUM = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];

    if(jipdanSubType==='아낌이보금자리') steps = steps.filter(s=>!s.includes('컨퍼런스콜'));

  function houseTypeLTV(houseType, disposalCond){
    if(houseType==='생애최초') return 80;
    if(houseType==='무주택') return 70;
    if(houseType==='1주택보유') return disposalCond ? 70 : 60;
    return 0;
  }
  function jipdanLtvResultHtml(c){

  }
  function monthsToYearsLabel(months){
    months = parseInt(months)||0;

  function incomeEffectiveManwon(type, amountManwon, cardWon){
    if(type==='카드사용액'){
      const cardReal = (parseFloat(stripComma(cardWon))||0) * 10000;
      const estWon = Math.min((cardReal/0.409)*0.9, CARD_INCOME_CAP_WON);
      return estWon/10000;
    }
    return parseFloat(stripComma(amountManwon))||0;
  }
  function combinedIncomeManwon(info){
    const self = incomeEffectiveManwon(info.selfType, info.selfAmount, info.selfCard);
    const spouse = info.spouseCombine ? incomeEffectiveManwon(info.spouseType, info.spouseAmount, info.spouseCard) : 0;
    return self + spouse;
  }

  function computeDSR(c){
    const income = parseFloat(c.income)||0;
    const stressAdd = parseFloat(c.stressAdd)||0;
    const nl = c.newLoan;
    const newRate = (parseFloat(nl.rate)||0) + (nl.stress ? stressAdd : 0);
    const newAnnual = annualRepayment(nl.amount, newRate, nl.months, nl.method);

    let existingAnnual = 0;
    (c.existingLoans||[]).forEach(l=>{
      const rate = (parseFloat(l.rate)||0) + (l.stress ? stressAdd : 0);
      existingAnnual += annualRepayment(l.balance, rate, l.months, l.method);
    });

    const totalAnnual = newAnnual + existingAnnual;
    const dsr = income>0 ? (totalAnnual/income*100) : 0;
    const limit = c.institution === '은행권' ? 40 : 50;

    // max additional new-loan principal at the limit, given existing loans fixed
    const budgetAtLimit = income*(limit/100) - existingAnnual;
    const maxNewPrincipal = budgetAtLimit>0 ? principalFromAnnualBudget(budgetAtLimit, newRate, nl.months||360) : 0;

    return { newAnnual, existingAnnual, totalAnnual, dsr, limit, maxNewPrincipal, income };
  }

  function annualInterestOnly(balance, ratePct, months, method){
    balance = parseFloat(stripComma(balance))||0;
    ratePct = parseFloat(ratePct)||0;
    if(balance<=0) return 0;
    if(method==='만기일시') return balance*(ratePct/100);
    const r = ratePct/100/12;
    return balance*r*12; // 첫달 이자 기준 연환산 (원리금균등/원금균등 근사)
  }

  function computeDTI(c){
    const d = computeDSR(c);
    const stressAdd = parseFloat(c.stressAdd)||0;
    let existingInterestAnnual = 0;
    (c.existingLoans||[]).forEach(l=>{
      const rate = (parseFloat(l.rate)||0) + (l.stress ? stressAdd : 0);
      existingInterestAnnual += annualInterestOnly(l.balance, rate, l.months, l.method);
    });
    const totalDTI = d.newAnnual + existingInterestAnnual;
    const dti = d.income>0 ? (totalDTI/d.income*100) : 0;
    return { newAnnual:d.newAnnual, existingInterestAnnual, totalDTI, dti, limit:40, income:d.income };
  }

  function newLoanFirstMonth(nl){
    const P = (parseFloat(nl.amount)||0) * 10000; // 원 단위로 환산
    const rate = parseFloat(nl.rate)||0;
    const n = parseInt(nl.months)||0;
    if(P<=0 || n<=0) return null;
    const r = rate/100/12;
    let equalPMT;
    if(r===0){ equalPMT = P/n; } else { equalPMT = P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1); }
    const equalInterest = P*r;
    const equalPrincipal = equalPMT - equalInterest;
    const principalMonthly = P/n;
    const principalInterest = P*r;
    const principalTotal = principalMonthly + principalInterest;
    return { equalPMT, equalInterest, equalPrincipal, principalMonthly, principalInterest, principalTotal };
  }

  function fmtWon(n){
    n = Math.round(n||0);
    return n.toLocaleString('ko-KR');
  }
  function fmtManwon(n){
    // treat stored amounts as 만원 units for compactness
    return fmtWon(n);
  }
  function dday(dateStr){
    if(!dateStr) return null;
    const d = new Date(dateStr+'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.round((d-today)/86400000);
    return diff;
  }

  function bulkSmsApartmentOptions(){

  function bulkSmsFilteredList(){

  // SMS는 한글 90바이트까지 단문(SMS), 그 이상은 장문(LMS)으로 전환되고
  // 기기별 sms: 링크 길이 제한 때문에 아주 길면 잘릴 수 있어 미리 안내한다.
  function smsLengthNoteHtml(text){
    const chars = (text||'').length;
    if(chars===0) return `<span style="color:var(--ink-dim);">내용 없음</span>`;
    const bytes = new Blob([text]).size;
    let kind, color;
    if(bytes<=90){ kind='단문 SMS'; color='var(--ink-dim)'; }
    else if(bytes<=2000){ kind='장문 LMS'; color='var(--ink-dim)'; }
    else { kind='LMS 제한(2,000바이트) 초과 — 잘릴 수 있어요'; color='var(--red)'; }
    const warn = chars>1200 ? `<br/><span style="color:var(--amber);">⚠️ 내용이 길어 기기에 따라 문자 앱에서 뒷부분이 잘릴 수 있어요. 잘리면 첨부 항목을 줄여주세요.</span>` : '';
    return `<span style="color:${color};">${chars.toLocaleString()}자 · ${bytes.toLocaleString()}바이트 · ${kind}</span>${warn}`;
  }
  function bulkSmsStartLabel(count){
    if(count<=BULK_SMS_BATCH_SIZE) return `${count}명에게 발송 시작`;
    const batches = Math.ceil(count/BULK_SMS_BATCH_SIZE);
    return `${count}명에게 발송 시작 (${BULK_SMS_BATCH_SIZE}명씩 ${batches}묶음)`;
  }
  function buildBulkSmsFullText(c){
    let text = bulkSmsMessage||'';
    const extras = [];
    if(bulkSmsAttachSheet){
      const tpl = SHEET_TEMPLATES[c.loanProduct];
      if(tpl) extras.push(buildSheetText(c));
    }
    if(bulkSmsAttachDocs){
      const hasChecked = DOCS_LIST.some(d=>docApplies(c,d) && docChecked(c,d));
      if(hasChecked) extras.push(buildDocsText(c));
    }
    if(bulkSmsIncludeBeforeChecklist) extras.push(BALANCE_BEFORE_TEXT);
    if(bulkSmsIncludeDayOfChecklist) extras.push(BALANCE_DAYOF_TEXT);
    if(extras.length>0) text = (text ? text+'\n\n' : '') + extras.join('\n\n');
    return text;
  }

  function renderBulkSmsSending(){
    const list = bulkSmsSelected.map(id=>customers.find(c=>c.id===id)).filter(Boolean);
    const total = list.length;
    const idx = Math.min(bulkSmsIndex, total);
    const done = idx>=total;
    const c = !done ? list[idx] : null;
    const phone = c ? (allPhones(c)[0]||'') : '';
    const filledMsg = c ? buildBulkSmsFullText(c) : '';
    const batchNumber = Math.floor(idx/BULK_SMS_BATCH_SIZE)+1;
    const totalBatches = Math.max(1, Math.ceil(total/BULK_SMS_BATCH_SIZE));
    const atCheckpoint = !done && idx>0 && idx<total && idx%BULK_SMS_BATCH_SIZE===0 && idx!==bulkSmsCheckpointDismissedAt;
    let html = `
      <div class="topbar">
        <div class="topbar-title">문자 발송 진행</div>
        <div class="topbar-sub">${done ? '전체 발송 완료' : `${idx+1} / ${total} 번째 고객 · ${batchNumber}/${totalBatches} 묶음`}</div>
      </div>
      <div class="container">`;
    if(done){
      html += `

  // ---------- render: balance schedule dashboard ----------
  function balanceFilteredList(){
    const now = new Date();
    const thisMonthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    const nd = new Date(now.getFullYear(), now.getMonth()+1, 1);
    const nextMonthKey = `${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`;
    return customers.filter(c=>{
      if(!c.balanceDate) return false;
      if(dashFilter.product.length>0 && !dashFilter.product.includes(dashProductToken(c))) return false;
      if(dashFilter.status.length>0 && !dashFilter.status.includes(c.status)) return false;
      if(dashFilter.period==='thisMonth' && monthKey(c.balanceDate)!==thisMonthKey) return false;
      if(dashFilter.period==='nextMonth' && monthKey(c.balanceDate)!==nextMonthKey) return false;
      if(dashFilter.period==='custom'){
        if(dashFilter.from && c.balanceDate < dashFilter.from) return false;
        if(dashFilter.to && c.balanceDate > dashFilter.to) return false;
      }
      return true;
    }).sort((a,b)=> (a.balanceDate||'').localeCompare(b.balanceDate||''));
  }

    // semicircle gauge path
    const R = 70, cx=90, cy=82;
    const startAngle = Math.PI, endAngle = Math.PI - Math.PI*arcPct;
    const x1 = cx + R*Math.cos(startAngle), y1 = cy + R*Math.sin(startAngle);
    const x2 = cx + R*Math.cos(endAngle), y2 = cy + R*Math.sin(endAngle);
    const largeArc = arcPct>0.5 ? 1 : 0;
    const arcPath = `M ${x1} ${y1} A ${R} ${R} 0 ${largeArc} 1 ${x2} ${y2}`;
    const limitAngle = Math.PI - Math.PI*(d.limit/60);
    const lx = cx + R*Math.cos(limitAngle), ly = cy + R*Math.sin(limitAngle);

  function icsEscape(s){
    return (s||'').replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n');
  }
  function toICSDate(dateStr){ return dateStr.replace(/-/g,''); }
  function addDaysStr(dateStr, n){
    const d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()+n);
    return d.toISOString().slice(0,10).replace(/-/g,'');
  }
  function buildICS(c, sel){
    const events = [];
    if(sel.consult && c.consultDate) events.push({kind:'time', dt:c.consultDate, title:`📝[대출자서] ${c.name||'고객'}`, desc:'대출상담 CRM 자동 생성 일정'});
    if(sel.followup && c.nextFollowup) events.push({kind:'time', dt:c.nextFollowup, title:`🔁[추가상담및자서] ${c.name||'고객'}`, desc:'대출상담 CRM 자동 생성 일정'});
    if(sel.balance && c.balanceDate) events.push({kind:'allday', date:c.balanceDate, title:`🏦[대출실행] ${c.name||'고객'}`, desc:`대출상담 CRM 자동 생성 일정. 연락처: ${c.phone||'-'}`});
    if(events.length===0) return null;
    const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LoanCRM//KO','CALSCALE:GREGORIAN'];
    events.forEach((e,i)=>{
      lines.push('BEGIN:VEVENT');
      lines.push('UID:'+c.id+'-'+i+'@loancrm');
      lines.push('DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z');
      if(e.kind==='time'){
        lines.push('DTSTART;TZID=Asia/Seoul:'+toICSDateTime(e.dt));
        lines.push('DTEND;TZID=Asia/Seoul:'+addMinutesToLocal(e.dt,60));
      } else {
        lines.push('DTSTART;VALUE=DATE:'+toICSDate(e.date));
        lines.push('DTEND;VALUE=DATE:'+addDaysStr(e.date,1));
      }
      lines.push('SUMMARY:'+icsEscape(e.title));
      if(e.desc) lines.push('DESCRIPTION:'+icsEscape(e.desc));
      lines.push('END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }
  function downloadICS(c, sel){
    const ics = buildICS(c, sel);
    if(!ics){ doToast('선택한 일정에 날짜가 없어요'); return; }
    const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${(c.name||'customer')}_일정.ics`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    doToast('일정 파일 다운로드 완료');
  }

  // ---------- 상담표 (sheet) helpers ----------
  function sheetFinalRate(sheet, baseKey, addKey, hasPrefer, items){
    const base = parseFloat(sheet[baseKey])||0;
    const add = parseFloat(sheet[addKey])||0;
    const prefer = hasPrefer ? preferTotal(sheet, items) : 0;
    return base + add - prefer;
  }
  function rateFormulaBlock(sheet, opts){
    const final = sheetFinalRate(sheet, opts.baseKey, opts.addKey, opts.hasPrefer, opts.items);
    const prefer = opts.hasPrefer ? preferTotal(sheet, opts.items) : 0;
    return `
      <div class="sheet-formula">
        <input type="number" step="0.01" data-skey="${opts.baseKey}" value="${sheet[opts.baseKey]||''}" placeholder="기준금리"/>
        <span>+</span>
        <input type="number" step="0.01" data-skey="${opts.addKey}" value="${sheet[opts.addKey]||''}" placeholder="가산금리"/>
        ${opts.hasPrefer?`<span>-</span><span style="font-family:var(--mono)">${prefer.toFixed(1)}%</span>`:''}
        <span>=</span>
        <b style="color:var(--navy-900)">${final.toFixed(2)}%</b>
      </div>
    `;
  }
  function sheetPreferBlock(sheet, title, items, maxLabel){
    items = items || PREFER_ITEMS;
    const total = preferTotal(sheet, items);
    return `
      <div class="sheet-bar">${title||'우대금리항목'} (최대 ${maxLabel||'0.9%'})</div>
      <div class="sheet-box">

  function initSheetDrawing(c){
    const wrap = document.getElementById('sheet-draw-wrap');
    const page = document.getElementById('sheet-capture-target');
    const canvas = document.getElementById('sheet-draw-canvas');
    if(!wrap || !page || !canvas) return;
    const cssW = page.offsetWidth || wrap.offsetWidth;
    const cssH = page.offsetHeight || 400;
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = cssW+'px';
    canvas.style.height = cssH+'px';
    canvas.width = Math.max(1, Math.round(cssW*dpr));
    canvas.height = Math.max(1, Math.round(cssH*dpr));
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.clearRect(0, 0, cssW, cssH);
    if(c.sheetDrawing){
      const img = new Image();
      img.onload = ()=>{ ctx.drawImage(img, 0, 0, cssW, cssH); };
      img.src = c.sheetDrawing;
    }
    if(!sheetDrawOn) return;
    let drawing = false;
    function posFromEvent(e){
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }
    function start(e){
      e.preventDefault();
      drawing = true;
      const p = posFromEvent(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    }
    function move(e){
      if(!drawing) return;
      e.preventDefault();
      const p = posFromEvent(e);
      if(sheetPenMode==='eraser'){
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 22;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = sheetPenColor;
        ctx.lineWidth = 2.6;
      }
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    function end(e){
      if(!drawing) return;
      drawing = false;
      c.sheetDrawing = canvas.toDataURL('image/png');
      saveCustomers(false);
    }
    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    canvas.addEventListener('pointerleave', end);
  }

  function buildDocsText(c){
    function renderChecked(section){
      const items = DOCS_LIST.filter(d=>d.section===section && docApplies(c,d) && docChecked(c,d));
      const out = [];
      let lastSub;
      items.forEach(d=>{
        if(d.subgroup !== lastSub){ out.push(`· ${d.subgroup}`); lastSub = d.subgroup; }
        out.push('☑ '+docLabel(d).replace(/\n/g,' '));
      });
      return out;
    }
    const debtorLines = renderChecked('채무자');
    const spouseLines = renderChecked('배우자');
    const lines = [];
    lines.push('담보대출 준비서류 안내');
    if(c.apartmentName) lines.push(`${c.apartmentName}${c.unitNumber?' '+c.unitNumber:''}`);
    lines.push('');
    lines.push('■채무자');
    if(debtorLines.length===0) lines.push('(체크된 서류 없음)');
    lines.push(...debtorLines);
    if(spouseLines.length>0){
      lines.push('');
      lines.push('☆배우자소득합산시-배우자준비서류☆');
      lines.push(...spouseLines);
    }
    lines.push('');
    lines.push('✓ 체크된것만 서류준비하세요');
    lines.push('※대출진행시 추가서류가 발생할 수 있습니다.');
    lines.push('서류 준비 시 성명 및 주민번호 13자리 식별 가능하게 발급해주세요.');
    lines.push('준비하시면서 궁금한 점 있으시면 전화주세요.');
    lines.push('');
    lines.push('감사합니다^^*');
    lines.push('');
    lines.push('하나은행');
    lines.push('대출상담사 송명호');
    return lines.join('\n');
  }

  async function shareDocs(c){
    const hasChecked = DOCS_LIST.some(d=>docApplies(c,d) && docChecked(c,d));
    if(!hasChecked){ doToast('체크된 서류가 없어요 — 먼저 체크해주세요'); return; }
    const text = buildDocsText(c);
    doToast('전송 준비 중…');
    try{
      if(navigator.share){
        await navigator.share({title:'담보대출 준비서류 안내', text});
        return;
      }
    }catch(e){
      if(e && e.name==='AbortError') return;
    }
    doToast('공유 기능 미지원 — 문자 앱으로 대체할게요');
    const smsUrl = 'sms:'+(c.phone?c.phone.replace(/-/g,''):'')+'?body='+encodeURIComponent(text);
    window.location.href = smsUrl;
  }

    root.querySelectorAll('input').forEach(el=> el.addEventListener('change', ()=>{ readSiteForm(); }));

    document.getElementById('btn-siteedit-back').onclick = ()=>{ readSiteForm(); saveSites(false); view='sites'; render(); };
    document.getElementById('btn-add-unit').onclick = ()=>{ readSiteForm(); s.units.push(blankSiteUnit()); renderSiteEdit(); };
    document.getElementById('btn-add-rate').onclick = ()=>{ readSiteForm(); s.rateOptions.push(blankSiteRate()); renderSiteEdit(); };
    document.querySelectorAll('[data-add-floor]').forEach(el=>{
      el.onclick = ()=>{ readSiteForm(); s.units[parseInt(el.getAttribute('data-add-floor'))].floors.push(blankSiteFloor()); renderSiteEdit(); };
    });
    document.querySelectorAll('[data-unit-rm]').forEach(el=>{
      el.onclick = ()=>{ readSiteForm(); s.units.splice(parseInt(el.getAttribute('data-unit-rm')),1); renderSiteEdit(); };
    });
    document.querySelectorAll('[data-floor-rm]').forEach(el=>{
      el.onclick = ()=>{
        readSiteForm();
        const [ui,fi] = el.getAttribute('data-floor-rm').split(':').map(Number);
        s.units[ui].floors.splice(fi,1);
        renderSiteEdit();
      };
    });
    document.querySelectorAll('[data-rate-rm]').forEach(el=>{
      el.onclick = ()=>{ readSiteForm(); s.rateOptions.splice(parseInt(el.getAttribute('data-rate-rm')),1); renderSiteEdit(); };
    });
    document.getElementById('btn-site-save').onclick = ()=>{ readSiteForm(); saveSites(true); };
    document.getElementById('btn-site-delete').onclick = ()=>{
      if(confirm('이 아파트현장을 삭제할까요?')){
        apartmentSites = apartmentSites.filter(x=>x.id!==s.id);
        saveSites(false); view='sites'; render();
      }
    };
  }

  function buildSheetText(c){
    const s = c.sheet;
    const applied = (parseFloat(stripComma(c.newLoan.amount))||0)*10000;
    const years = monthsToYearsLabel(c.newLoan.months);
    const lines = [];
    lines.push(`[${c.loanProduct} 상담표]`);
    lines.push(`고객명: ${c.name||'-'}  연락처: ${allPhones(c).join(', ')||'-'}`);
    if(c.consultDate) lines.push(`대출자서: ${fmtDT(c.consultDate)}`);
    if(c.balanceDate) lines.push(`대출실행(잔금일): ${c.balanceDate}`);
    lines.push('');

    if(c.loanProduct==='집단대출'){
      const ltvPct = houseTypeLTV(c.jipdanHouseType, c.jipdanDisposalCond);
      const isAkkime = c.jipdanSubType==='아낌이보금자리';
      const finalRate = isAkkime ? (parseFloat(s.fixedRate)||0) : sheetFinalRate(s,'baseRate','addRate',true,JIPDAN_PREFER_ITEMS);
      const preferOn = JIPDAN_PREFER_ITEMS.filter(p=>s[p.key]).map(p=>p.label);
      lines.push('▶ 대출 기본 정보');
      if(c.apartmentName) lines.push(`아파트명: ${c.apartmentName}${c.unitNumber?' ('+c.unitNumber+')':''}`);
      if(c.jipdanHouseType) lines.push(`주택유형: ${c.jipdanHouseType}${c.jipdanDisposalCond?' (잔금당일 처분조건)':''}  ·  LTV ${ltvPct}%`);
      if(c.jipdanAppraisal) lines.push(`감정가: ${fmtWon((parseFloat(stripComma(c.jipdanAppraisal))||0)*10000)}원`);
      if(c.jipdanArea) lines.push(`전용면적: ${c.jipdanArea}㎡${c.jipdanFloorLabel?' · '+c.jipdanFloorLabel:''}`);
      if(c.jipdanLawFirm) lines.push(`법무법인: ${c.jipdanLawFirm}`);
      if(c.jipdanMoveInPeriod) lines.push(`입주기간: ${c.jipdanMoveInPeriod}`);
      lines.push(`대출금액: ${fmtManwon(c.newLoan.amount)}만원 (${krWon(applied)})`);
      lines.push('');
      lines.push('▶ 대출기간 · 금리유형');
      lines.push(`금리유형: ${isAkkime ? '고정금리' : (s.rateType||'-')}`);
      lines.push(`실제 대출기간(비거치): ${years}년`);
      lines.push('');
      if(isAkkime){
        lines.push('▶ 금리 (최종금리는 대출실행 당일에 확정됨)');
        lines.push(`금리: ${finalRate.toFixed(2)}%`);
        lines.push('');
      } else {
        lines.push('▶ 금리 (최종금리는 대출실행 당일에 확정됨)');
        lines.push(`기준금리 ${s.baseRate||0}% + 가산금리 ${s.addRate||0}% - 우대금리 ${preferTotal(s,JIPDAN_PREFER_ITEMS).toFixed(1)}% = 최종 ${finalRate.toFixed(2)}%`);
        lines.push('');
        lines.push('▶ 우대금리항목 (최대 0.3%)');
        lines.push(JIPDAN_PREFER_ITEMS.map(p=>`${s[p.key]?'☑':'☐'} ${p.label} (${p.pct}%)`).join('\n'));
        lines.push(`우대금리 합계: ${preferTotal(s,JIPDAN_PREFER_ITEMS).toFixed(1)}%`);
        lines.push('');
      }
      lines.push('▶ 중도상환수수료');
      if(c.jipdanSubType==='아낌이보금자리'){
        lines.push('· 중도상환금액의 0.5% 부과 (슬라이드방식)');
        lines.push('· 3년 초과 시 중도상환수수료 면제');
      } else {
        lines.push(`· 매년 최초대출금의 30%(${fmtWon(applied*0.3)}원)까지 면제`);
        lines.push(`· 30%(${fmtWon(applied*0.3)}원) 초과 시 상환수수료 0.6%~ 부과 (슬라이드방식)`);
        lines.push('· 3년 초과 시 중도상환수수료 면제');
      }
      lines.push('');
      lines.push('▶ 부대비용');
      lines.push(`인지대: ${fmtWon(stampDutyByAmount(applied))}원  ·  송금수수료: ${fmtWon(REMIT_FEE_FIXED)}원`);

      lines.push('');
      const nb = newLoanFirstMonth({amount:c.newLoan.amount, rate:finalRate, months:c.newLoan.months});

      lines.push('▶ 대출 진행 절차');
      lines.push(jipdanSteps(c.jipdanSubType).join(' → '));
      lines.push('');
      const jItems = [
        {k:'salePrice', label:'분양잔금'}, {k:'balconyExpand', label:'발코니(확장비)잔금'},
        {k:'option', label:'옵션잔금'}, {k:'interestPostpaid', label:'이자후불'},
        {k:'stampDutyItem', label:'인지대', auto:stampDutyByAmount(applied)},
        {k:'interimLoan', label:'중도금(잔금일까지 이자포함)'},
        {k:'remitFeeItem', label:'송금수수료(약)', auto:REMIT_FEE_FIXED},
        {k:'otherItem', label:'기타'},

      jItems.forEach(it=>{
        const v = it.auto!==undefined ? it.auto : (parseFloat(stripComma(s[it.k]))||0);
        lines.push(`${it.label}: ${fmtWon(v)}원`);
      });
      lines.push(`계: ${fmtWon(jTotal)}원`);
      lines.push(`- 잔금대출신청금: ${fmtWon(applied)}원`);

      const jutaekDeal = (parseFloat(stripComma(c.jutaekDealPrice))||0)*10000;
      const jutaekKb = (parseFloat(stripComma(c.jutaekKbPrice))||0)*10000;
      const base = (jutaekDeal>0 && jutaekKb>0) ? Math.min(jutaekDeal,jutaekKb) : (jutaekDeal||jutaekKb||0);
      const ltvPct = houseTypeLTV(c.jutaekHouseType, c.jutaekDisposalCond);

      if(c.apartmentName) lines.push(`아파트명: ${c.apartmentName}`);
      if(c.unitNumber) lines.push(`동호수: ${c.unitNumber}`);
      if(c.jutaekHouseType) lines.push(`주택유형: ${c.jutaekHouseType}${c.jutaekDisposalCond?' (잔금당일 처분조건)':''}  ·  LTV ${ltvPct}% (${fmtWon(ltvAmount)}원)`);
      if(c.jutaekDealPrice) lines.push(`매매가: ${fmtWon(jutaekDeal)}원`);
      if(c.jutaekKbPrice) lines.push(`KB시세: ${fmtWon(jutaekKb)}원`);
      lines.push(`대출금액: ${fmtManwon(c.newLoan.amount)}만원 (${krWon(applied)})`);
      lines.push('');
      lines.push('▶ 대출기간');
      lines.push('6년 ~ 40년');
      lines.push(`실제 대출기간: ${years}년`);
      lines.push('');
      lines.push('▶ 금리 (최종금리는 대출실행 당일에 확정됨)');
      lines.push(`기준금리 ${s.baseRate||0}% + 가산금리 ${s.addRate||0}% - 우대금리 ${preferTotal(s).toFixed(1)}% = 최종 ${finalRate.toFixed(2)}%`);
      lines.push('');
      lines.push('▶ 우대금리항목 (최대 0.9%)');
      lines.push(preferOn.map(p=>`${s[p.key]?'☑':'☐'} ${p.label} (${p.pct}%)`).join('\n'));

      lines.push('');
      lines.push('▶ 중도상환수수료');
      lines.push('· 고정금리 시 0.65%~, 변동금리 시 0.78%~ (슬라이드방식)');
      lines.push('· 중도상환금액 × 중도상환해약금율 × (대출잔여일수/대출기간)');

      lines.push('');
      lines.push('▶ 부대비용');
      lines.push(`인지대: ${fmtWon(stampDutyByAmount(applied))}원`);
      if(s.bondFee) lines.push(`채권매입비: 약 ${fmtWon(parseFloat(stripComma(s.bondFee))||0)}원`);
      if(s.otherFee) lines.push(`기타: ${fmtWon(parseFloat(stripComma(s.otherFee))||0)}원`);
      lines.push('');
      const nb = newLoanFirstMonth({amount:c.newLoan.amount, rate:finalRate, months:c.newLoan.months});
      lines.push('▶ 월납입액 (첫달 기준)');
      if(nb){
        lines.push(`원리금균등: ${fmtWon(nb.equalPMT)}원 (원금 ${fmtWon(nb.equalPrincipal)} + 이자 ${fmtWon(nb.equalInterest)})`);
        lines.push(`원금균등: ${fmtWon(nb.principalTotal)}원 (원금 ${fmtWon(nb.principalMonthly)} + 이자 ${fmtWon(nb.principalInterest)})`);
      } else lines.push('대출금액·금리·기간 입력 시 계산돼요');
    } else if(c.loanProduct==='전세대출'){
      const finalRate = sheetFinalRate(s,'baseRate','addRate',true);

      const deposit = (parseFloat(stripComma(c.jeonseDeposit))||0)*10000;

      if(c.unitNumber) lines.push(`동호수: ${c.unitNumber}`);
      if(c.jeonseHouseType) lines.push(`주택유형: ${c.jeonseHouseType}  ·  LTV ${ltvPct}% (${fmtWon(ltvAmount)}원)`);

      lines.push(`대출희망금액: ${fmtManwon(c.newLoan.amount)}만원 (${krWon(applied)})`);
      lines.push('대출기간: 2년');
      lines.push('');
      lines.push('▶ 금리 (최종금리는 대출실행 당일에 확정됨)');
      lines.push(`기준금리 ${s.baseRate||0}% + 가산금리 ${s.addRate||0}% - 우대금리 ${preferTotal(s).toFixed(1)}% = 최종 ${finalRate.toFixed(2)}%`);
      lines.push('');
      lines.push('▶ 우대금리항목 (최대 0.9%)');
      lines.push(PREFER_ITEMS.map(p=>`${s[p.key]?'☑':'☐'} ${p.label} (${p.pct}%)`).join('\n'));
      lines.push(`우대금리 합계: ${preferTotal(s).toFixed(1)}%`);
      lines.push('');
      lines.push('▶ 중도상환수수료');
      lines.push('· 상환수수료 0.59%~ 부과 (슬라이드방식)');
      lines.push('· 3년 초과 시 중도상환수수료 면제');
      lines.push('');
      const feeParts = [];
      if(s.deliveryFee) feeParts.push(`송달료 ${fmtWon(parseFloat(stripComma(s.deliveryFee))||0)}원`);
      feeParts.push(`인지대 ${fmtWon(parseFloat(stripComma(s.stampDuty))||0)}원`);
      if(s.loanInsuranceApplies) feeParts.push('대출금보증보험료(승인 후 안내)');
      if(s.depositInsuranceApplies) feeParts.push('전세금보증보험료(승인 후 안내)');
      lines.push('▶ 부대비용');
      lines.push(feeParts.join(' · '));
      lines.push('');
      const nb = newLoanFirstMonth({amount:c.newLoan.amount, rate:finalRate, months:c.newLoan.months||24});
      lines.push('▶ 월납입액 (이자만 납부)');
      lines.push(nb ? `이자: ${fmtWon(nb.equalInterest)}원 / 월` : '대출금액·금리 입력 시 계산돼요');

      lines.push('▶ 잔금당일 전입조건');
      lines.push('전입신고 후 전입등본 및 전입세대열람표 팩스 또는 사진문자전송 필수 (팩스 0504-363-6864)');
    }

    lines.push('');
    lines.push('※ 위 내용은 참고용 추정치이며 실제 금리·한도·비용은 대출실행일 기준 은행 심사 결과에 따라 달라질 수 있습니다.');
    return lines.join('\n');
  }

  async function shareSheet(c){
    const summaryText = buildSheetText(c);
    doToast('전송 준비 중…');
    try{
      if(navigator.share){
        await navigator.share({title:`${c.loanProduct} 상담표`, text: summaryText});
        return;
      }
    }catch(e){
      if(e && e.name==='AbortError') return; // user cancelled the share sheet
    }

    // fallback: no Web Share support — open SMS with prefilled text
    doToast('공유 기능 미지원 — 문자 앱으로 대체할게요');
    const smsUrl = 'sms:'+(c.phone?c.phone.replace(/-/g,''):'')+'?body='+encodeURIComponent(summaryText);
    window.location.href = smsUrl;
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  function render(){
    if(!stateReady){
      root.innerHTML = `<div style="padding:60px 20px;text-align:center;color:var(--ink-dim);font-family:var(--sans)">불러오는 중…</div>`;
      return;
    }
    if(view==='list') renderList();
    else if(view==='sheet') renderSheet();
    else if(view==='docs') renderDocs();
    else if(view==='sites') renderSites();
    else if(view==='siteEdit') renderSiteEdit();
    else if(view==='balanceDash') renderBalanceDash();
    else if(view==='bulkSms') renderBulkSms();
    else renderDetail();
  }

  loadSites();
  loadCustomers();
})();
</script>
